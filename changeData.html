<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Formulir ke Telegram</title>
</head>
<body>
  <form id="myForm">
    <input type="text" name="nama" placeholder="Nama" required>
    <input type="email" name="email" placeholder="Email" required>
    <textarea name="pesan" placeholder="Pesan" required></textarea>
    <button type="submit">Kirim</button>
  </form>

  <script>
    document.getElementById('myForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const token = '8179867554:AAELDuXYnYfykvCvlDx-FJxWzWkdxOxFbOs';
      const chat_id = '6936723956';
      const nama = this.nama.value;
      const email = this.email.value;
      const pesan = this.pesan.value;

      const message = `Nama: ${nama}\nEmail: ${email}\nPesan: ${pesan}`;

      fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          chat_id: chat_id,
          text: message
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.ok) {
          alert('Pesan berhasil dikirim!');
        } else {
          alert('Terjadi kesalahan: ' + data.description);
        }
      })
      .catch(error => {
        alert('Terjadi kesalahan: ' + error.message);
      });
    });
  </script>
</body>
</html>
